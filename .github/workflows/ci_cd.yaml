name: Enterprise Multi-Agent Incident Pipeline CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------------
  # 1. Code Quality & Linting
  # -------------------------------------------------------------------
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Tools
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check . --exit-zero


  # -------------------------------------------------------------------
  # 2. Unit, Security & Guardrail Testing
  # -------------------------------------------------------------------
  test:
    name: Unit & Security Guardrail Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGCHAIN_TRACING_V2: "false"
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'default-ci-test-jwt-secret-key-32b' }}
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Execute Pytest Suite
        run: |
          pytest tests/ -v
          

  # -------------------------------------------------------------------
  # 3. LangSmith Evaluation Regression Gate
  # -------------------------------------------------------------------
  langsmith-eval:
    name: LangSmith LLM-as-a-Judge Evaluation Gate
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT || 'Enterprise-Mediclaim-Agent-CI' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'default-ci-test-jwt-secret-key-32b' }}
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run LangSmith Evaluation Runner
        run: |
          python evals/run_evals.py

  # -------------------------------------------------------------------
  # 4. Container Build & Packaging
  # -------------------------------------------------------------------
  docker-build:
    name: Build & Smoke Test Docker Container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: enterprise-mediclaim-agent:latest
